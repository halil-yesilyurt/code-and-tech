name: Refresh production lockfile (temporary)
on:
  push:
    branches: [fix/ui-motion-seo-security-audit]
    paths:
      - package.json
      - .github/workflows/refresh-security-lock.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Refresh lockfile and fix compatible vulnerabilities
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true # CI independently enforces production high-severity gate
      - name: Commit updated lockfile
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(deps): resolve compatible high-severity transitive fixes'
            git push origin HEAD:fix/ui-motion-seo-security-audit
          fi
